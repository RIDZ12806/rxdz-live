name: Deploy RXDZ site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "RXDZ_CONTROL_PRO_GLASS.zip"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and configure site files
        run: |
          mkdir -p public
          unzip -o RXDZ_CONTROL_PRO_GLASS.zip -d package
          cp -R package/site/. public/
          echo "=== LIVE BACKEND CORS PREFLIGHT TEST ==="
          curl -sS -i -X OPTIONS "https://rxdz-live-production-84f98571.up.railway.app/api/admin/login" -H "Origin: https://ridz12806.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type"
          echo
          echo "=== END CORS PREFLIGHT TEST ==="
          echo "=== FRONTEND API CONFIG DIAGNOSTIC ==="
          grep -nE "const API|let API|var API|API[[:space:]]*=|fetch\(API|/api/admin/login|admin/me" public/index.html || true
          echo "=== END API CONFIG DIAGNOSTIC ==="
          echo "=== Frontend API references ==="
          grep -RInE "fetch\\(|XMLHttpRequest|/api/admin/login|API_URL|API_BASE|RAILWAY|netlify" public --include="*.html" --include="*.js" | head -200 || true
          python3 - <<'PY'
          from pathlib import Path
          backend = "https://rxdz-live-production-84f98571.up.railway.app"
          shim = """
          <script>
          /* RXDZ_RAILWAY_FETCH_SHIM */
          (() => {
            const backend = "https://rxdz-live-production-84f98571.up.railway.app";
            const originalFetch = window.fetch.bind(window);
            window.fetch = (resource, options = {}) => {
              let target = resource;
              const raw = resource instanceof Request ? resource.url : String(resource);
              try {
              const parsed = new URL(raw, window.location.href);
              if (parsed.pathname.startsWith("/api/")) {
                target = backend + parsed.pathname + parsed.search + parsed.hash;
              }
            } catch (_) {}
            if (resource instanceof Request && target !== resource) {
              target = new Request(target, resource);
            }
            return originalFetch(target, { ...options, credentials: options.credentials || "include" });
            };
          })();
          </script>
          """
          html_files = list(Path("public").rglob("*.html"))
          if not html_files:
              raise SystemExit("No HTML files found in extracted site")
          for path in html_files:
              data = path.read_text(encoding="utf-8")
              if "RXDZ_RAILWAY_FETCH_SHIM" not in data:
                  if "<head>" in data:
                      data = data.replace("<head>", "<head>\\n" + shim, 1)
                  elif "<HEAD>" in data:
                      data = data.replace("<HEAD>", "<HEAD>\\n" + shim, 1)
                  else:
                      data = shim + "\\n" + data
                  path.write_text(data, encoding="utf-8")
          print("Configured Railway API routing in", len(html_files), "HTML file(s)")
          PY
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
