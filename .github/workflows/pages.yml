name: Deploy RXDZ site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "RXDZ_CONTROL_PRO_GLASS.zip"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and configure site files
        run: |
          mkdir -p public
          unzip -o RXDZ_CONTROL_PRO_GLASS.zip -d package
          cp -R package/site/. public/
          echo "=== LIVE BACKEND CORS PREFLIGHT TEST ==="
          curl -sS -i -X OPTIONS "https://rxdz-live-production-84f98571.up.railway.app/api/admin/login" -H "Origin: https://ridz12806.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type"
          echo
          echo "=== END CORS PREFLIGHT TEST ==="
          echo "=== FRONTEND API CONFIG DIAGNOSTIC ==="
          grep -nE "const API|let API|var API|API[[:space:]]*=|fetch\(API|/api/admin/login|admin/me" public/index.html || true
          echo "=== END API CONFIG DIAGNOSTIC ==="
          echo "=== Frontend API references ==="
          grep -RInE "fetch\\(|XMLHttpRequest|/api/admin/login|API_URL|API_BASE|RAILWAY|netlify" public --include="*.html" --include="*.js" | head -200 || true
          python3 - <<'PY'
          from pathlib import Path
          backend = "https://rxdz-live-production-84f98571.up.railway.app"
          shim = """
          <script>
          /* RXDZ_RAILWAY_FETCH_SHIM */
          (() => {
            const backend = "https://rxdz-live-production-84f98571.up.railway.app";
            const tokenKey = "rxdz_admin_token";
            const originalFetch = window.fetch.bind(window);
            window.fetch = async (resource, options = {}) => {
              let target = resource;
              const raw = resource instanceof Request ? resource.url : String(resource);
              let apiPath = "";
              try {
                const parsed = new URL(raw, window.location.href);
                if (parsed.pathname.startsWith("/api/")) {
                  apiPath = parsed.pathname;
                  target = backend + parsed.pathname + parsed.search + parsed.hash;
                }
              } catch (_) {}
              const headers = new Headers(resource instanceof Request ? resource.headers : undefined);
              new Headers(options.headers || {}).forEach((value, key) => headers.set(key, value));
              const savedToken = localStorage.getItem(tokenKey);
              if (savedToken && apiPath && apiPath !== "/api/admin/login") {
                headers.set("X-Admin-Token", savedToken);
              }
              if (resource instanceof Request && target !== resource) {
                target = new Request(target, resource);
              }
              const response = await originalFetch(target, {
                ...options,
                headers,
                credentials: options.credentials || "include"
              });
              if (apiPath === "/api/admin/login" && response.ok) {
                try {
                  const data = await response.clone().json();
                  if (data.token) localStorage.setItem(tokenKey, data.token);
                } catch (_) {}
              }
              if (apiPath === "/api/admin/logout" && response.ok) {
                localStorage.removeItem(tokenKey);
              }
              return response;
            };
          })();
          </script>
          """
          html_files = list(Path("public").rglob("*.html"))
          if not html_files:
              raise SystemExit("No HTML files found in extracted site")
          for path in html_files:
              data = path.read_text(encoding="utf-8")
              if "RXDZ_RAILWAY_FETCH_SHIM" not in data:
                  if "<head>" in data:
                      data = data.replace("<head>", "<head>\\n" + shim, 1)
                  elif "<HEAD>" in data:
                      data = data.replace("<HEAD>", "<HEAD>\\n" + shim, 1)
                  else:
                      data = shim + "\\n" + data
                  path.write_text(data, encoding="utf-8")
          print("Configured Railway API routing in", len(html_files), "HTML file(s)")
          PY
          # Point DJ upload and media playback at Railway (not the GitHub Pages origin).
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/index.html")
          if not p.exists():
              raise SystemExit("public/index.html not found")
          s = p.read_text(encoding="utf-8")
          s = s.replace('fetch("/api/admin/dj/upload"', 'fetch(API+"/api/admin/dj/upload"')
          s = s.replace('("/media/"+encodeURIComponent(x.audioFile))', '(API+"/media/"+encodeURIComponent(x.audioFile))')
          p.write_text(s, encoding="utf-8")
          print("Patched DJ upload and audio playback URLs.")
          PY
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
