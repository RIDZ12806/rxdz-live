name: Deploy RXDZ site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "RXDZ_CONTROL_PRO_GLASS.zip"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and configure site files
        run: |
          mkdir -p public
          unzip -o RXDZ_CONTROL_PRO_GLASS.zip -d package
          cp -R package/site/. public/
          echo "=== Frontend API references ==="
          grep -RInE "fetch\\(|XMLHttpRequest|/api/admin/login|API_URL|API_BASE|RAILWAY|netlify" public --include="*.html" --include="*.js" | head -200 || true
          python3 - <<'PY'
          from pathlib import Path
          backend = "https://rxdz-live-production-84f98571.up.railway.app"
          shim = """
          <script>
          (() => {
            const backend = "https://rxdz-live-production-84f98571.up.railway.app";
            const originalFetch = window.fetch.bind(window);
            window.fetch = (resource, options = {}) => {
              let target = resource;
              if (typeof resource === "string" && (resource.startsWith("/api/") || resource.startsWith("api/"))) {
                target = backend + (resource.startsWith("/") ? resource : "/" + resource);
              } else if (resource instanceof URL && resource.origin === window.location.origin && resource.pathname.startsWith("/api/")) {
                target = backend + resource.pathname + resource.search;
              }
              return originalFetch(target, { ...options, credentials: options.credentials || "include" });
            };
          })();
          </script>
          """
          html_files = list(Path("public").rglob("*.html"))
          if not html_files:
              raise SystemExit("No HTML files found in extracted site")
          for path in html_files:
              data = path.read_text(encoding="utf-8")
              if "rxdz-live-production-84f98571.up.railway.app" not in data:
                  if "</body>" in data:
                      data = data.replace("</body>", shim + "\\n</body>")
                  else:
                      data += shim
                  path.write_text(data, encoding="utf-8")
          print("Configured Railway API routing in", len(html_files), "HTML file(s)")
          PY
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
